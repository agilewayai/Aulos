practice_notes:
- Bass-only pass through Aria + three chosen variations — sing or tap the ground.
- Canon-entry hunting on every third variation; journal interval and voice.
- One “character room” evening (Overture / Adagio / Quodlibet).
- Compare Gould 1955 vs 1981 on the same three variations — tempo philosophy only.
- One harpsichord vs one piano hearing of Vars. 16 and 25 — instrument as rhetoric.
zh:
  work_title: J.S. 巴赫 —《哥德堡变奏曲》，BWV 988
  composer: 约翰·塞巴斯蒂安·巴赫
  catalog: BWV 988
  era: 晚期巴洛克（1741年莱比锡出版）
  form: 咏叹调（Aria）与三十段变奏，并以 Aria da capo 收束；建立在三十二小节固定低音之上
  listening_thesis: 先把 Aria 的低音骨架听进心里：其后三十间“房间”，皆是这一地基上的发明，而非互不相干的炫技罗列。
  work_introduction: 《哥德堡变奏曲》以一首萨拉班德步态的 Aria 开篇，其美首先是建筑性的：它教会耳朵一条可记忆的低音地基。三十段变奏随之在这一地基上展开——或宫廷、或卡农、或炫技、或近乎痛苦的内省——最终
    Aria 如记忆般归来。真正的聆听，是放下只追逐花纹的习惯，去追踪：同一条低音，如何撑起整个性格世界。
  composer_portrait:
    caption: 六十一岁的巴赫，手持六声部卡农 BWV 1076——莱比锡晚期大师风骨的面容。
    credit: 埃利亚斯·戈特洛布·豪斯曼《巴赫肖像》（1748年本；公有领域，经 Wikimedia Commons）
  composer_profile:
    lifespan: 1685–1750
    summary: 约翰·塞巴斯蒂安·巴赫乃盛期巴洛克对位艺术的巅峰：管风琴家、乐长，亦是键盘技艺的百科全书式编纂者。莱比锡晚期，他将毕生技法收束为一部部出版套曲，如供手与耳共用的私人学府。
    temperament: 并非浪漫主义意义上的“抒情人格”，而是秩序的工匠——舞曲、卡农与修辞相互编织，直至情感本身显现为结构。
    place_in_oeuvre: BWV 988为《键盘练习曲》第四部，与帕蒂塔、意大利协奏曲／法国序曲、管风琴弥撒同属其键盘总汇。在巴赫的变奏作品中，它是最公开的纪念碑：宫廷娱乐被提升为百科全书式的艺术。
    place_in_history: 它衔接巴洛克变奏传统与现代所谓“完整键盘宇宙”的观念。历经十九世纪相对冷落，二十世纪上半叶复兴（朗多芙斯卡，继以古尔德）使其成为文化象征——钢琴艺术与历史表演实践皆以此自测。
  genesis:
    year: '1741'
    place: 莱比锡
    publication: 《键盘练习曲》第四部（纽伦堡，Balthasar Schmid 刊行）
    patronage: 后世传说将其与凯泽林克伯爵及年轻羽管键琴家约翰·戈特利布·哥德堡相连；印刷出版的语境较“失眠夜曲”轶闻更为坚实。
    background: 巴赫莱比锡晚期成熟期：历经教会与宫廷岁月后，他以出版套曲穷尽一种形式来施教。Aria 的萨拉班德步态与三十二小节低音，成为卡农（音程递升）、体裁转写、双手交叉炫技与情感深度的实验室。
    instrument_culture: 为双层键盘羽管键琴而构思——音栓与双手分配至关重要。作品宜于室内亲密尺度，而非管弦洪流。
  historical_stature:
    reasons:
    - 百科全书式的变奏工艺：性格小品、卡农与诙谐歌（quodlibet）同承一条低音。
    - 形式建筑可被耳朵测绘——中点法国序曲（第16变奏）如第二次起承。
    - 情感弧线经小调低谷（尤以第25变奏）后，以诙谐收束与“被记住的 Aria”完成回环。
    - 接受史使一部专门家的印刷品化为二十世纪的聆听神话。
    - 持续考验乐器、速度、装饰音与“本真性”的哲学。
    reception_arc: 十八世纪专门家印刷品 → 十九世纪相对隐没 → 二十世纪初羽管键琴复兴 → 1955年古尔德成为大众纪念碑 → 历史演奏与现代钢琴学派持续对话。
  width_points:
  - 《键盘练习曲》第四部；巴赫已刊键盘变奏艺术的巅峰。
  - 宫廷娱乐与百科全书式技法并存（卡农、体裁转写、双手交叉）。
  - 接受史：十九世纪冷落 → 二十世纪初复兴 → 世纪中叶录音使之成为文化纪念碑。
  - 聆听路径因乐器而异：羽管键琴的亲密、现代钢琴的建筑感、历史演奏的音色。
  - 在其创作中的邻作：帕蒂塔、意大利协奏曲，以及晚期对位总汇。
  depth_points:
  - 先锁定 Aria 低音，再追逐表面花纹。
  - 变奏常可按“三”感知（性格＋卡农）；卡农音程递升。
  - 第16变奏法国序曲＝形式中点／第二次起承。
  - 小调群（15、21、25）加深情感；第25变奏常为低谷。
  - 第30变奏诙谐歌为机智顶点；Aria 再现如记忆。
  listening_map:
  - label: Aria
    cue: 低音骨架；萨拉班德步态——先把地基记住。
  - label: 变奏 1–15
    cue: 卡农音程上升；性格之室与卡农交替。
  - label: 变奏 16
    cue: 附点法国序曲再启——听出“第二次开始”。
  - label: 变奏 17–24
    cue: 序曲之后，炫技与如歌交替。
  - label: 变奏 25–30 与 Aria
    cue: 小调深度 → 诙谐一笑 → 被记住的 Aria。
  variation_deepdives:
  - title: Aria
    note: 萨拉班德修辞；真正的主题在低音。
  - title: 卡农序列（每隔两首）
    note: 卡农按音程攀升——训练耳朵捕捉进入。
  - title: 第16变奏 — 序曲
    note: 形式枢纽；附点庄重重置后半。
  - title: 第25变奏 — 柔板
    note: 常为情感低谷；在周围的眩目中守住静定。
  - title: 第30变奏 — 诙谐歌
    note: 民谣机智作结，然后 Aria 归来。
  sound_world:
    original_instrument: 双层键盘羽管键琴（Clavier）——双手交叉织体依赖键盘分层，而非现代制音踏板的戏剧。
    ensemble_notes: 独奏键盘作品。后世弦乐三重奏、管弦或爵士改编属于接受史，并非巴赫原谱——可作音色参照，不可当作“原作编制”。
    modern_modes:
    - 羽管键琴／历史演奏——发音法、不等律音色、室内亲密。
    - 现代钢琴——延音、力度建筑；古尔德式清晰与浪漫式笼罩之间的选择。
    - 对照聆听——同一变奏换乐器，看低音是否依然成立。
  related_works:
  - title: 巴赫 —《键盘练习曲》第一部（帕蒂塔，BWV 825–830）
    why: 同一出版键盘宇宙；舞曲组曲即性格训练。
  - title: 巴赫 — 意大利协奏曲与法国序曲（《键盘练习曲》第二部）
    why: 分享第16变奏再度出现的法国序曲修辞。
  - title: 巴赫 —《赋格的艺术》／《音乐的奉献》
    why: 晚期百科全书式对位——形式不同，志向同类。
  - title: 贝多芬 —《迪亚贝利变奏曲》，作品120
    why: 后世以变奏“建造世界”的巅峰；跨世纪对话。
  - title: 勃拉姆斯 —《亨德尔主题变奏曲》，作品24
    why: 十九世纪键盘变奏工艺，仍在巴赫长影之中。
