  practice_notes:
  - 只听低音：过一遍 Aria 与任选三首变奏——唱或敲打地基。
  - 猎捕卡农进入：每隔两首变奏；记下音程与声部。
  - 一个“性格之室”之夜（序曲／柔板／诙谐歌）。
  - 同一三首变奏，对照古尔德1955与1981——只问速度哲学。
  - 第16与第25变奏，各听羽管键琴与钢琴版本——乐器即修辞。
  myths_and_caveats:
  - 凯泽林克／哥德堡“失眠夜曲”故事属接受史传说，学界有争议——宜作传说呈现，不可写成已证实的委约叙事。
  - 所谓“本真”速度与装饰音仍是诠释问题；应标明版本与乐器，而非宣称绝对真理。
