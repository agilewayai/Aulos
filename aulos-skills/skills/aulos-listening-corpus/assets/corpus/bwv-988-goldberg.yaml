dossier_id: bwv-988
work_title: J.S. Bach — Goldberg Variations, BWV 988
composer: Johann Sebastian Bach
catalog: BWV 988
era: Late Baroque (published 1741, Leipzig)
form: Aria with 30 variations + closing Aria da capo on a 32-bar ground bass
listening_thesis: Hold the Aria’s bass architecture in the ear first; the thirty rooms are inventions
  on that ground, not a parade of unrelated surfaces.
composer_portrait:
  image_url: https://upload.wikimedia.org/wikipedia/commons/6/6a/Johann_Sebastian_Bach.jpg
  credit: Elias Gottlob Haussmann — Portrait of J.S. Bach (1748 version; public domain via Wikimedia Commons)
  caption: Bach at sixty-one, holding the six-part Canon BWV 1076 — the face of late Leipzig mastery.
composer_profile:
  lifespan: 1685–1750
  summary: 'Johann Sebastian Bach stands as the summit of High Baroque contrapuntism: organist, Kapellmeister,
    and encyclopedist of keyboard craft. In Leipzig’s later years he gathered a lifetime of technique
    into published cycles that read like private universities for the hands and the ear.'
  temperament: Not a Romantic “expressive” persona but a craftsman of order — dance, canon, and rhetoric
    braided until feeling arrives as structure itself.
  place_in_oeuvre: 'BWV 988 is the Fourth Part of the Clavier-Übung — the keyboard summa that also includes
    the Partitas, Italian Concerto / French Overture, and Organ Mass. Among Bach’s variation works it
    is the most public monument: courtly entertainment raised to encyclopedic art.'
  place_in_history: A hinge between Baroque variation practice and the modern idea of the “complete keyboard
    cosmos.” After long 19th-century neglect, early- and mid-20th-century revival (Landowska, then Gould)
    made it a cultural monument — a work against which pianism and historically informed performance both
    measure themselves.
genesis:
  year: '1741'
  place: Leipzig
  publication: Clavier-Übung, Part IV (Nürnberg, Balthasar Schmid)
  patronage: Associated in later lore with Count Keyserlingk and the young harpsichordist Johann Gottlieb
    Goldberg; the printed dedication culture is clearer than the “insomnia night music” anecdote.
  background: 'Bach’s late Leipzig maturity: after decades of church and court service, he published keyboard
    cycles that teach by exhausting a form. The Aria’s sarabande gait and 32-bar bass become a laboratory
    for canons (rising by interval), genre paraphrases, hand-crossing bravura, and affective depth.'
  instrument_culture: Conceived for a two-manual harpsichord — registration and hand distribution matter.
    The work thrives in intimate chamber scale, not orchestral mass.
historical_stature:
  reasons:
  - 'Encyclopedic variation craft: character pieces, canons, and a quodlibet under one bass.'
  - Formal architecture listeners can map — midpoint French Overture (Var. 16) as second beginning.
  - Affective arc with a minor-mode nadir (esp. Var. 25) before comic culmination and remembered Aria.
  - Reception history turned a specialist print into a 20th-century listening mythos.
  - Continues to test philosophies of instrument, tempo, ornament, and authenticity.
  reception_arc: 18th-c specialist print → 19th-c relative obscurity → early 20th-c harpsichord revival
    → 1955 Gould as popular monument → HIP and modern piano schools in dialogue ever since.
work_introduction: 'The Goldberg Variations open with an Aria whose beauty is architectural: a sarabande
  that teaches the ear a ground bass. Thirty variations then invent rooms upon that ground — some courtly,
  some canonic, some athletic, some almost painfully introspective — before the Aria returns as memory.
  To listen well is to stop chasing only the filigree and start tracking how one bass supports an entire
  world of character.'
width_points:
- Fourth part of Clavier-Übung; summit of Bach’s published keyboard variation craft.
- Mix of courtly entertainment and encyclopedic technique (canons, genre paraphrases, hand-crossing).
- Reception: 19th-c neglect → early 20th-c revival → mid-century recordings as cultural monument.
- Listening modes differ: harpsichord intimacy vs modern piano architecture vs HIP colors.
- Place in oeuvre: sibling to Partitas, Italian Concerto, and the late contrapuntal summae.
depth_points:
- Lock the ear on the Aria bass before chasing surface figuration.
- Variation grouping often felt in threes (character + canon); canons rise in interval.
- Var. 16 French Overture = formal midpoint / second beginning.
- Minor-mode cluster (15, 21, 25) as affective deepening; 25 as frequent nadir.
- Quodlibet (30) as witty culmination; Aria return as memory.
myths_and_caveats:
- The Keyserlingk / Goldberg “insomnia night music” story is reception lore, historically debated — present
  as legend, not proven commission narrative.
- “Authentic” tempo and ornament remain interpretive; cite editions and instruments rather than absolute
  truth.
listening_map:
- label: Aria
  cue: Bass architecture; sarabande gait — memorize the ground.
- label: Vars. 1–15
  cue: Rising canon intervals; alternate character rooms and canons.
- label: Var. 16
  cue: Dotted French Overture reopen — hear the second beginning.
- label: Vars. 17–24
  cue: Bravura vs cantabile alternation after the Overture.
- label: Vars. 25–30 + Aria
  cue: Minor depth → Quodlibet smile → remembered Aria.
variation_deepdives:
- title: Aria
  note: Sarabande rhetoric; the bass is the true theme.
- title: Canon sequence (every third variation)
  note: Canons climb by interval — train the ear to catch entries.
- title: Variation 16 — Ouverture
  note: Formal hinge; dotted majesty resets the second half.
- title: Variation 25 — Adagio
  note: Often the emotional nadir; hold stillness against surrounding dazzle.
- title: Variation 30 — Quodlibet
  note: Folksong wit as culmination before the Aria’s return.
sound_world:
  original_instrument: Two-manual harpsichord (Clavier) — manuals enable crossed-hand textures without
    modern damper theater.
  ensemble_notes: Solo keyboard work. Later arrangements (string trio, orchestra, jazz) are receptions,
    not Bach’s scoring — useful for color, not as “original.”
  modern_modes:
  - Harpsichord / HIP — articulation, unequal temperament colors, chamber intimacy.
  - Modern piano — sustain, dynamic architecture, Gould-line clarity vs Romantic wash.
  - Comparative listening — same variation across instruments to hear what the bass still does.
