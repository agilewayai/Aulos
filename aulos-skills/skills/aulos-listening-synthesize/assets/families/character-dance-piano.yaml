- title: Search — piano mazurkas (comparative gait)
  url: https://www.youtube.com/results?search_query=piano+mazurkas+comparative
  why: Start with gait literacy across a short set.
- title: Search — Romantic piano waltz / polonaise character
  url: https://www.youtube.com/results?search_query=Romantic+piano+waltzes+polonaises
  why: Kindred dance rooms under related accent problems.
