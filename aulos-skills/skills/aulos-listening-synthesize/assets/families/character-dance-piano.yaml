work_title_template: '{composer} — Character dances for piano'
era: Romantic piano dance-character practice
form: Stylized national / social dances as short piano character pieces (often ternary rooms)
listening_thesis: Hear the dance gait first — accent, limp, and lift — then let harmony and rubato tint
  the room; these are character dances, not ballroom transcripts.
work_introduction: Romantic character dances for piano turn folk and salon steps into miniature theatres.
  A serious listening path treats meter and accent as identity, then follows how harmony, mode, and
  tempo flexibility make each piece a distinct room rather than a parade of pretty surfaces.
genesis:
  year: early–mid 19th century (varies by composer and opus)
  place: National memory meeting salon and recital culture
  publication: Often issued in sets or groups across a composer’s career — treat dating per opus.
  patronage: Salon intimacy and published piano markets; verify dedicatees per piece.
  background: Stylized dances (mazurka, waltz, polonaise, and kin) migrate from social floor to keyboard
    rhetoric — accents and ternary rooms become expressive grammar.
  instrument_culture: Early Romantic / mid-century pianos evolving toward modern grand — pedals, touch,
    and rubato culture reshape how dance character speaks.
historical_stature:
  reasons:
  - Turns dance meter into personal character rather than functional accompaniment.
  - Builds a lifelong atlas of short forms that reward comparative listening across a set.
  - Reception often hears “national” feeling inside absolute piano craft — label lore carefully.
  - Becomes a teaching and recital core for Romantic piano poetry and accent literacy.
  reception_arc: Salon intimacy → recital canon → debates on folk authenticity vs stylization → HIP vs
    modern piano color.
width_points:
- Hold the dance gait (accent pattern) before chasing melody ornaments.
- Sets and groups invite comparative rooms — same dance type, different temperaments.
- Rubato and pedal are grammar here; state the recording’s era rather than one “correct” pulse.
- Reception lore about homeland and exile is often stronger than documentary certainty — keep caveats.
depth_points:
- Lock the opening bars’ accent limp or lift; tap it through the whole piece.
- Notice A–B–A or episodic rooms — how the return remembers or revises the first character.
- Track mode shifts and chromatic color as emotional weather over the dance ground.
- Compare two recordings for accent sharpness vs lyric smoothing of the same dance type.
- In a set evening, journal three temperaments under one dance name.
listening_map:
- label: Opening gait
  cue: Memorize accent and pulse before ornament.
- label: Middle room
  cue: Contrast, mode tint, or episodic turn — still on the dance ground.
- label: Return / close
  cue: Does the opening character come back intact, deepened, or ironized?
variation_deepdives:
- title: Accent ownership
  note: Journal which beat limps or lifts — and whether the pianist sharpens or softens it.
- title: Ternary memory
  note: After the middle room, can you still feel the opening gait under the return?
- title: Set temperament
  note: In a group, name three rooms that share a dance label but not a mood.
sound_world:
  original_instrument: Mid-19th-c. piano evolving toward modern concert grand
  ensemble_notes: Usually solo piano; later orchestrations are receptions, not the listening thesis.
  modern_modes:
  - Modern grand — sustain and color; watch that pedal does not blur accent identity.
  - Period / early Romantic piano — clearer speech, different rubato space.
  - Comparative listening — same dance type across two tempi philosophies.
related_works:
- title: Kindred character dances (waltzes, polonaises, mazurkas across composers)
  why: Same accent-literacy problem under different national and salon masks.
- title: Lyric piano miniatures (nocturnes, preludes)
  why: Contrast — song without dance gait vs gait with song.
- title: Larger Romantic piano forms (ballades, scherzos)
  why: Hear how short dance rooms scale into longer narrative architecture.
interpretations:
- artist: Mid-century Romantic piano cycles
  year: mid-20th c.
  instrument: Piano
  era_note: Cantabile salon aristocracy — dance often lyricized.
  why_listen: A humane baseline for hearing character under singing line.
  youtube_url: https://www.youtube.com/results?search_query=Romantic+piano+mazurkas+waltzes
  discogs_url: https://www.discogs.com/search/?q=Romantic+piano+mazurkas&type=master
- artist: Dance-accent specialists (national-dance rhetoric on modern piano)
  year: late 20th–21st c.
  instrument: Piano
  era_note: Accent literacy vs lyric smoothing debates.
  why_listen: Compare how sharply the gait speaks against smoothed cantabile.
  youtube_url: https://www.youtube.com/results?search_query=piano+mazurka+polonaise+comparative
  discogs_url: https://www.discogs.com/search/?q=piano+mazurkas+polonaises&type=master
- artist: Historically minded / early-piano approaches
  year: HIP era
  instrument: Period piano / early Romantic instruments
  era_note: Lighter action and clearer speech reset modern-grand assumptions.
  why_listen: Hear accent and silence without heavy sustain fog.
  discogs_url: https://www.discogs.com/search/?q=fortepiano+mazurka+waltz+polonaise&type=master
