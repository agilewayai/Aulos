zh:
  work_title_template: '{composer} — 钢琴性格舞曲'
  era: 浪漫主义钢琴性格舞曲传统
  form: 风格化的民族／社交舞曲作为短小钢琴性格小品（常为三部性房间）
  listening_thesis: 先听舞曲步态——重音、跛行与抬升——再让和声与弹性速度给房间上色；这是性格舞曲，而非舞厅实录。
  work_introduction: 浪漫主义钢琴性格舞曲把民俗与沙龙步伐变成微型剧场。认真的聆听路径，先把节拍与重音当作身份，再追随和声、调式与速度弹性如何使每首成为不同的房间，而非漂亮表面的罗列。
  genesis:
    year: 十九世纪早中期（视作曲家与作品号而定）
    place: 民族记忆与沙龙／独奏会文化相遇之处
    publication: 常以套曲或分组贯穿作曲家生涯——系年须按作品核对。
    patronage: 沙龙亲密与钢琴出版市场；题献须按作品核实。
    background: 风格化舞曲（玛祖卡、圆舞曲、波洛奈兹及其亲属）从社交场地迁入键盘修辞——重音与三部性房间成为表现语法。
    instrument_culture: 早期浪漫至世纪中叶钢琴向现代三角琴演进——踏板、触键与弹性速度文化重塑舞曲性格的言说方式。
  historical_stature:
    reasons:
    - 把舞曲节拍变成个人性格，而非功能性伴奏。
    - 建立短小体裁的终生地图，奖励成套对照聆听。
    - 接受史常在绝对钢琴工艺中听见“民族”感受——传说须谨慎标注。
    - 成为浪漫钢琴诗意与重音识读的教学与独奏会核心。
    reception_arc: 沙龙亲密 → 独奏会经典 → 民俗本真与风格化之争 → 古乐与现代钢琴音色之辩。
  width_points:
  - 先把握舞曲步态（重音型），再追逐旋律装饰。
  - 套曲邀请对照之室——同一种舞曲名，不同性情。
  - 弹性速度与踏板是语法；陈述录音年代，而非单一“正确”脉搏。
  - 关于故土与流亡的接受史传说往往强于文献确定性——保留存疑。
  depth_points:
  - 锁定开篇小节的重音跛行或抬升；贯穿全曲轻叩。
  - 注意 A–B–A 或插部房间——再现如何记忆或改写最初性格。
  - 追踪调式转折与半音色彩，作为舞曲地基上的情绪气候。
  - 对照两版录音：同一种舞曲的重音锋利与抒情磨平。
  - 成套之夜，在同一个舞曲名下记下三种性情。
  listening_map:
  - label: 开篇步态
    cue: 先记住重音与脉搏，再听装饰。
  - label: 中部之室
    cue: 对比、调式着色或插部转折——仍在舞曲地基上。
  - label: 再现／收束
    cue: 开篇性格是原样归来、加深，还是带反讽？
  variation_deepdives:
  - title: 重音归属
    note: 记下哪一拍跛行或抬升——演奏者是锐化还是软化它。
  - title: 三部性记忆
    note: 中部之后，你是否仍能在再现下感到开篇步态？
  - title: 套曲性情
    note: 在一组中，点名三个同舞曲名而不同情绪的房间。
  sound_world:
    original_instrument: 十九世纪中叶钢琴，向现代音乐会三角琴演进
    ensemble_notes: 通常为独奏钢琴；后世管弦改编属接受史，非聆听论题本身。
    modern_modes:
    - 现代三角琴——延音与色彩；留意踏板勿模糊重音身份。
    - 古钢琴／早期浪漫钢琴——言说更清晰，弹性空间不同。
    - 对照聆听——同一种舞曲下的两种速度哲学。
  related_works:
  - title: 亲属性格舞曲（跨作曲家的圆舞曲、波洛奈兹、玛祖卡）
    why: 同一重音识读问题，戴着不同民族与沙龙面具。
  - title: 抒情钢琴小品（夜曲、前奏曲）
    why: 对照——无舞曲步态的歌，与有歌的步态。
  - title: 更大的浪漫钢琴体裁（叙事曲、谐谑曲）
    why: 听见短小舞曲房间如何放大为更长叙述建筑。
  interpretations:
  - artist: 世纪中叶浪漫钢琴里程碑套曲
    year: 二十世纪中叶
    instrument: 钢琴
    era_note: 歌唱性沙龙贵族气——舞曲常被抒情化。
    why_listen: 在歌唱线条下听见性格的人道基线。
  - artist: 舞曲重音专家路径（现代钢琴上的民族舞曲修辞）
    year: 二十世纪末至二十一世纪
    instrument: 钢琴
    era_note: 重音识读与抒情磨平之辩。
    why_listen: 对照步态言说的锋利与抒情磨平。
  - artist: 历史知情／早期钢琴路径
    year: 古乐时代
    instrument: 古钢琴／早期浪漫乐器
    era_note: 更轻的触键与更清晰的言说，重置现代三角琴假设。
    why_listen: 在沉重延音雾气之外听见重音与休止。
  appreciation_videos:
  - title: 检索 — 钢琴玛祖卡（对照步态）
    url: https://www.youtube.com/results?search_query=piano+mazurkas+comparative
    why: 以短套开始步态识读。
  - title: 检索 — 浪漫钢琴圆舞曲／波洛奈兹性格
    url: https://www.youtube.com/results?search_query=Romantic+piano+waltzes+polonaises
    why: 亲属舞曲房间，共享相关重音问题。
  vinyl_and_discography:
  - label: Discogs 检索 — 钢琴玛祖卡
    url: https://www.discogs.com/search/?q=piano+mazurkas&type=master&format_exact=Vinyl
    note: 浏览世纪中叶与现代精选集。
  - label: Discogs 检索 — 浪漫钢琴性格舞曲
    url: https://www.discogs.com/search/?q=piano+waltzes+polonaises&type=master
    note: 亲属舞曲货架，供对照聆听。
  practice_notes:
  - 一晚——同一种舞曲三首；只记重音。
  - 一晚——同一首听两遍；第二遍压低装饰，保住步态。
  - 对照同一作品号的两版录音：特征拍的跛行与抬升。
  - 边听边唱低音／左手型——测试舞曲记忆。
  - 一首舞曲配一首夜曲——点名步态增加或减去了什么。
  myths_and_caveats:
  - 民俗本真主张常是接受史传说；无文献时宁可说“风格化舞曲性格”。
  - 勿编造作品轶事；题献与系年须按作品核实。
  - 当公开授权库尚无舞曲录音时，氛围乐可能是浪漫钢琴关联——须诚实标注。
