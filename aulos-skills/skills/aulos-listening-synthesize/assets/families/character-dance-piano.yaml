- label: Discogs search — piano mazurkas
  url: https://www.discogs.com/search/?q=piano+mazurkas&type=master&format_exact=Vinyl
  note: Browse mid-century and modern selected sets.
- label: Discogs search — Romantic piano character dances
  url: https://www.discogs.com/search/?q=piano+waltzes+polonaises&type=master
  note: Kindred dance shelves for comparative listening.
practice_notes:
- One evening — three pieces of the same dance type; journal only accents.
- One evening — one piece twice; second pass mute ornament, keep gait.
- Compare two recordings of the same opus for limp vs lift of the signature beat.
- Sing the bass / left-hand pattern while the track plays — test dance memory.
- Pair one dance piece with one nocturne — name what the gait adds or removes.
myths_and_caveats:
- Folk authenticity claims are often reception lore; prefer “stylized dance character” unless documented.
- Do not invent opus anecdotes; verify dedications and dating per piece.
- Ambient may be a Romantic piano peer when no public dance recording is in the open library — label it honestly.
