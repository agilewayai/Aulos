practice_notes:
- One evening — Op. 69 only; journal who leads each theme entry.
- One evening — a variation set; tap the theme through every variation.
- One evening — Op. 102; mark three silences that feel like grammar.
- Compare one HIP and one modern recording of the same movement — balance only.
- Sing (or hum) a cello theme while muting the track — test memory of the duo’s speech.
myths_and_caveats:
- Do not treat every anecdotal dedicatee story as proven without checking the specific opus.
- “Authentic” balance depends on instruments; state the setup rather than absolute truth.
