work_title_template: '{composer} — Cello Sonatas & Variations (with piano)'
catalog: Beethoven set — Sonatas Opp. 5, 69, 102; Variations WoO 45–46 & Op. 66
era: Classical → early Romantic (c. 1796–1815 for the Beethoven cello cycle)
form: Duo sonatas and variation sets for cello and piano — conversational sonata rhetoric + variation
  craft
listening_thesis: 'Listen for equality of speech between cello and piano: who leads, who answers, and
  how register and silence turn the duo into a single argument.'
work_introduction: Beethoven’s cello-and-piano works are not “piano pieces with a singing guest.” They
  are a lifelong experiment in duo citizenship — from the brilliant early Op. 5 sonatas and charming variation
  sets, through the expansive middle-period Op. 69, to the concentrated late Op. 102 pair. A serious listening
  path treats the sonatas and variations as one atelier of dialogue.
genesis:
  year: 1796–1815
  place: Vienna (and Beethoven’s touring/publishing world)
  publication: Sonatas Opp. 5 (1796), 69 (1808/09), 102 (1815); variations WoO 45–46, Op. 66
  patronage: Early works linked to courtly and virtuoso cello culture (e.g. Duport circle) — verify specifics
    per piece.
  background: Across two decades Beethoven tests how a cello can claim sonata themes in high and low registers
    while the piano refuses mere accompaniment. The variation sets keep courtly wit beside that architectural
    ambition.
  instrument_culture: Classical cello (gut strings, transitional bows) with fortepiano/early modern piano
    — balance and articulation differ sharply from a modern steel-string cello against a concert grand.
historical_stature:
  reasons:
  - Emancipates the cello as a sonata equal — especially Op. 69’s lyric architecture.
  - Late Op. 102 compresses speech, silence, and motivic argument into duo form.
  - Variation sets preserve Classical wit while training ear for character change on a ground.
  - Becomes a measuring rod for later cello-piano literature (Brahms and after).
  reception_arc: Virtuoso-cellist repertoire → core teaching & recital canon → HIP vs modern-instrument
    debates on balance and tempo.
width_points:
- Span early brilliance (Op. 5), middle lyric breadth (Op. 69), and late concentration (Op. 102).
- Variations (WoO 45–46, Op. 66) as character rooms beside the sonata arguments.
- Duo balance is historical: fortepiano intimacy vs modern grand + steel-string cello.
- Reception lives in recital pairing — sonata evening vs variations as encores/character studies.
depth_points:
- Lock ear on opening rhetoric — who states the motto, cello or piano?
- Track register crossings where the cello climbs into “violin” space.
- In variations, hold the theme’s gait before chasing figuration.
- In Op. 102, notice speech-like pauses and compressed motivic returns.
- Compare Op. 69’s singing middle-period space with Op. 5’s earlier virtuoso sparkle.
listening_map:
- label: Op. 5 Sonatas
  cue: Early duo brilliance — piano often drives; hear the cello claiming themes.
- label: Variations (WoO / Op. 66)
  cue: Theme gait first; then character rooms — dance, lyric, bravura.
- label: Op. 69
  cue: Middle-period breadth — lyric cello citizenship and spacious dialogue.
- label: Op. 102
  cue: Late speech — silence, compression, motivic argument between equals.
variation_deepdives:
- title: Opening motto ownership
  note: On first hearing, journal which instrument “owns” the first idea — and when it flips.
- title: Variation theme return
  note: After dazzle, can you still tap the theme’s pulse?
- title: Late silence (Op. 102)
  note: Treat rests as rhetoric, not empty gaps.
sound_world:
  original_instrument: Cello with Classical/early Romantic piano (fortepiano evolving toward modern grand)
  ensemble_notes: Strict duo — no orchestra. Arrangements exist but the listening thesis is conversational
    chamber balance.
  modern_modes:
  - Modern cello + concert grand — power and sustain; watch that the piano does not bury the cello.
  - HIP / period instruments — lighter piano, gut cello colors, clearer speech.
  - Comparative listening — same movement on HIP vs modern to hear what the dialogue still does.
related_works:
- title: Beethoven — Violin Sonatas (esp. “Spring”, “Kreutzer”)
  why: Parallel duo rhetoric in another string register.
- title: Beethoven — Piano Sonatas (middle & late)
  why: The same motivic mind without a partner — useful contrast.
- title: Brahms — Cello Sonatas Opp. 38 & 99
  why: Later answer to Beethoven’s duo citizenship problem.
- title: Bach — Solo Cello Suites BWV 1007–1012
  why: Cello as complete speaker alone — reset the ear’s expectations.
