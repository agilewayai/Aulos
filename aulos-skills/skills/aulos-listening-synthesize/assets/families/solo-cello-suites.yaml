work_title_template: '{composer} — Cello Suites (unaccompanied)'
catalog: Bach — Six Suites for Unaccompanied Cello, BWV 1007–1012
era: High Baroque (c. 1717–1723, Cöthen period — dating debated)
form: Six dance suites for solo cello — prelude + allemande, courante, sarabande, optional galanteries,
  gigue; one instrument as complete speaker
listening_thesis: 'Listen for the cello as a complete speaker: how a single line implies bass, harmony,
  and dance character without piano partnership.'
work_introduction: Bach’s six cello suites are not “sonatas missing a piano.” They are an atelier of
  solo rhetoric — each suite a room of dance manners held by one bow. A serious path treats the set as
  six architectures of speech, not a single famous prelude with five appendices.
genesis:
  year: c. 1717–1723
  place: Cöthen (court of Leopold) — manuscript transmission later; Anna Magdalena copy central
  publication: No authorized print in Bach’s lifetime; 19th-century rediscovery (notably Casals) reshaped
    reception
  patronage: Courtly chamber culture; exact dedicatee evidence is thin — state uncertainty honestly
  background: The suites train the ear to hear implied polyphony inside a single melodic stream — bass
    footsteps under dance figures.
  instrument_culture: Baroque cello (gut, shorter neck, period bow) vs modern steel-string cello — articulation
    and chord voicing differ; name the setup when claiming “authentic” color.
historical_stature:
  reasons:
  - Emancipates the cello as a complete soloist — architecture without continuo.
  - Dance suite as listening curriculum — character change under unity of tonic room.
  - Casals-to-present reception turns specialist manuscripts into a cultural monument.
  - Measuring rod for later unaccompanied cello literature.
  reception_arc: Courtly manuscript → 19th-c. rediscovery → Casals monument → HIP vs modern cello debates.
width_points:
- Six suites as six tonic rooms — G, D, C, E-flat, C minor, D — not one prelude plus leftovers.
- Dance order is the map — prelude speech, then allemande / courante / sarabande / galanteries / gigue.
- Implied polyphony — hear the “missing” bass foot under the singing line.
- Reception lives in performers (Casals, Starker, Bylsma, Wispelwey, Isserlis…) more than in a single print.
depth_points:
- Lock the ear on Suite I Prelude’s harmonic footsteps before chasing fame.
- In each suite, name the dance character before the virtuoso surface.
- Sarabandes as slow speech — silence and weight inside the bar.
- Compare two suites in the same evening — what changes when the tonic room changes?
- Chordal writing — when the bow must imply several voices at once.
listening_map:
- label: Suite I (G major) — Prelude
  cue: Harmonic footsteps and open-string resonance — the public doorway.
- label: Allemande → Courante
  cue: Walking rhetoric into running speech.
- label: Sarabande
  cue: Slow weight — dance as meditation.
- label: Galanteries (Menuets / Bourrées / Gavottes)
  cue: Courtly character rooms between sarabande and gigue.
- label: Gigue / later suites
  cue: Closing wit; then open Suite II–VI as new tonic architectures.
variation_deepdives:
- title: Prelude as harmony lesson
  note: Can you hum the bass footsteps of Suite I Prelude without the recording?
- title: Sarabande speech
  note: Journal three places where silence feels like grammar.
- title: Suite as room
  note: After Suite I, open Suite V (C minor) — same dances, different weather.
sound_world:
  original_instrument: Solo Baroque / modern cello (no continuo)
  ensemble_notes: Unaccompanied — any piano partnership belongs to a different shelf (duo sonatas).
  modern_modes:
  - Period cello intimacy
  - Modern cello architecture
  - Comparative suite-to-suite listening
interpretations:
- artist: Pablo Casals
  year: early–mid 20th c.
  why_listen: The rediscovery monument — rhetorical gravity that made the suites public culture.
- artist: Anner Bylsma / period school
  year: late 20th c.
  why_listen: HIP articulation and dance gait without Romantic swell as default.
- artist: János Starker / modern school
  year: mid–late 20th c.
  why_listen: Architectural clarity on modern cello — line as structure.
appreciation_videos: []
vinyl_and_discography:
- label: Casals legacy sets
  note: Start with the reception story, then compare a HIP set of the same suite.
- label: One suite, two bows
  note: Same suite on period vs modern cello — journal balance and speech, not “winner.”
related_works:
- Bach — Violin Sonatas & Partitas (solo string sibling architecture)
- Bach — Keyboard suites / Partitas (dance manners on another instrument)
- Later unaccompanied cello etudes and suites (Kodály, Britten) as reception aftershocks
practice_notes:
- One evening — Suite I only; journal the prelude’s bass footsteps.
- One evening — three sarabandes from different suites; compare weight.
- One evening — Suite V; notice scordatura / darker weather if using a historical setup note.
- Mute the track and sing the gigue rhythm — test dance memory.
myths_and_caveats:
- Do not treat every Casals anecdote as documented fact without a source.
- BWV dating and Anna Magdalena copy debates remain open — say “debated” when unsure.
- These are not Beethoven cello-and-piano sonatas; do not import duo-sonata rhetoric.
- Keyboard variation cycles (BWV 988 and kin) are a different shelf — never a substitute identity for the cello suites.
