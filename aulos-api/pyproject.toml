[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aulos-api"
version = "0.1.0"
description = "Aulos API gateway — HTTP facade for agent, MCP, and web clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aulos" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
aulos-api = "aulos_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aulos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
