[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aulos-api"
version = "0.1.0"
description = "Aulos API gateway — HTTP facade for agent, MCP, and web clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aulos" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0,<4.1",
  "PyJWT>=2.8.0",
  "email-validator>=2.0",
  "fastembed>=0.5.0",
  # Agent + skill harness (in-process listening orchestration)
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
aulos-api = "aulos_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aulos_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
