[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aulos-mcp"
version = "0.1.0"
description = "Aulos MCP server — agent tool/integration surface via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aulos" }]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
aulos-mcp = "aulos_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aulos_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
