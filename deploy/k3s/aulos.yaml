  namespace: default
  labels:
    app: aulos-ops
    managed-by: aries-harness
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 5092
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
