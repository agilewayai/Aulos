  namespace: default
  labels:
    app: aulos-ops
    managed-by: aries-harness
    kubernetes.io/service-name: aulos-ops
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 5092
endpoints:
  - addresses:
      - 10.3.17.90
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aulos-ops
  namespace: default
  labels:
    app: aulos-ops
    managed-by: aries-harness
spec:
  rules:
    - host: aulos-ops.purezen.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aulos-ops
                port:
                  number: 80
